<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="50%" stop-color="#4c0519"/>
      <stop offset="100%" stop-color="#701a75"/>
    </linearGradient>
    <linearGradient id="warnGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- 배경 둥근 사각형 (스마트폰 앱 아이콘 스타일) -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect width="496" height="496" x="8" y="8" rx="104" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="6"/>

  <!-- 광통신 네온 선로 효과 -->
  <g opacity="0.8">
    <line x1="60" y1="120" x2="256" y2="270" stroke="#f43f5e" stroke-width="12" stroke-linecap="round"/>
    <line x1="452" y1="120" x2="256" y2="270" stroke="#f43f5e" stroke-width="12" stroke-linecap="round"/>
    <line x1="40" y1="210" x2="256" y2="270" stroke="#fbbf24" stroke-width="10" stroke-linecap="round"/>
    <line x1="472" y1="210" x2="256" y2="270" stroke="#fbbf24" stroke-width="10" stroke-linecap="round"/>
    <line x1="70" y1="360" x2="256" y2="270" stroke="#38bdf8" stroke-width="10" stroke-linecap="round"/>
    <line x1="442" y1="360" x2="256" y2="270" stroke="#38bdf8" stroke-width="10" stroke-linecap="round"/>
  </g>

  <!-- 중앙 위험 경고 삼각 엠블럼 -->
  <g filter="url(#glow)">
    <polygon points="256,65 446,380 66,380" fill="#0f172a" stroke="#ffffff" stroke-width="20" stroke-linejoin="round"/>
    <polygon points="256,90 426,368 86,368" fill="url(#warnGrad)"/>
    <polygon points="256,112 408,356 104,356" fill="#fbbf24"/>
  </g>

  <!-- 중앙 번개 & 광케이블 단선 위험 심볼 -->
  <path d="M250 135 L210 225 L250 225 L220 305 L305 205 L260 205 Z" fill="#b91c1c" stroke="#ffffff" stroke-width="5" stroke-linejoin="round"/>
  
  <!-- 광선로 케이블 및 불꽃 펄스 -->
  <path d="M150 305 Q256 345 362 305" fill="none" stroke="#dc2626" stroke-width="18" stroke-linecap="round"/>
  <path d="M170 330 Q256 365 342 330" fill="none" stroke="#f97316" stroke-width="12" stroke-linecap="round"/>
  <circle cx="150" cy="305" r="10" fill="#ffffff"/>
  <circle cx="362" cy="305" r="10" fill="#ffffff"/>
  <circle cx="256" cy="325" r="13" fill="#ffffff"/>

  <!-- 하단 위해개소 텍스트 리본 -->
  <rect x="106" y="405" width="300" height="66" rx="33" fill="#881337" stroke="#ffffff" stroke-width="4.5"/>
  <text x="256" y="450" font-family="-apple-system, BlinkMacSystemFont, 'Pretendard', sans-serif" font-size="35" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="2">위해개소</text>
</svg>
